plugins {
    id "com.android.application"
}

android {
    namespace "com.sanmn19.sengledlocal"
    compileSdk 34

    defaultConfig {
        applicationId "com.sanmn19.sengledlocal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0-test"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
